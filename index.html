<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('taskly.theme');
        } catch {}
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7755d9" />
    <meta
      name="description"
      content="A little clarity for your day. Organize your tasks, set priorities, and celebrate your progress with Taskly."
    />
    <title>Taskly — A little more focus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
